<!DOCTYPE html><html lang='id'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Gerbang Formatif</title><style>body{font-family:system-ui,sans-serif;max-width:720px;margin:0 auto;padding:20px;line-height:1.55;color:#18202f;background:#fff}
h1{font-size:1.4rem}.q{border:1px solid #d9dfea;border-radius:8px;padding:12px;margin:10px 0}button{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #2445c9;background:#2445c9;color:#fff;cursor:pointer}
.k{background:#eef1f8;padding:10px 12px;border-radius:8px}</style></head><body><h1>Gerbang Formatif</h1><p>Satu grafik v–t trapesium: naik 0→10 m/s dalam 2 s, tetap 10 m/s selama 4 s, turun ke 0 dalam 2 s.</p><form id='f'><div class='q'><b>1. Perpindahan total adalah…</b><label style='display:block'><input type='radio' name='q0' value='0'> 40 m</label><label style='display:block'><input type='radio' name='q0' value='1'> 60 m</label><label style='display:block'><input type='radio' name='q0' value='2'> 80 m</label><label style='display:block'><input type='radio' name='q0' value='3'> 100 m</label></div><div class='q'><b>2. Percepatan pada ruas kedua adalah…</b><label style='display:block'><input type='radio' name='q1' value='0'> 0</label><label style='display:block'><input type='radio' name='q1' value='1'> 5 m/s²</label><label style='display:block'><input type='radio' name='q1' value='2'> 10 m/s²</label><label style='display:block'><input type='radio' name='q1' value='3'> −5 m/s²</label></div><button type='submit'>Kirim jawaban</button></form><p id='hasil'></p>
<script>const K=[1, 0];document.getElementById('f').onsubmit=e=>{e.preventDefault();let b=0;K.forEach((k,i)=>{const v=document.querySelector('input[name=q'+i+']:checked');if(v&&+v.value===k)b++});
const s=Math.round(b/K.length*100);document.getElementById('hasil').textContent='Skor: '+s+'% ('+b+' dari '+K.length+')';
parent.postMessage({fims:'skor',skor:s},'*')}</script></body></html>
