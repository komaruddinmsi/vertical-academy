<!DOCTYPE html><html lang='id'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Kuis Tertunda</title><style>body{font-family:system-ui,sans-serif;max-width:720px;margin:0 auto;padding:20px;line-height:1.55;color:#18202f;background:#fff}
h1{font-size:1.4rem}.q{border:1px solid #d9dfea;border-radius:8px;padding:12px;margin:10px 0}button{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #2445c9;background:#2445c9;color:#fff;cursor:pointer}
.k{background:#eef1f8;padding:10px 12px;border-radius:8px}</style></head><body><h1>Kuis Tertunda</h1><p>Butir baru, tanpa bantuan, sekali jalan.</p><form id='f'><div class='q'><b>1. Grafik v–t mendatar di 3 m/s selama 5 s. Perpindahan…</b><label style='display:block'><input type='radio' name='q0' value='0'> 0 m</label><label style='display:block'><input type='radio' name='q0' value='1'> 3 m</label><label style='display:block'><input type='radio' name='q0' value='2'> 15 m</label><label style='display:block'><input type='radio' name='q0' value='3'> benda berhenti</label></div><div class='q'><b>2. Grafik a–t konstan 2 m/s² dari v₀=0 selama 3 s. Kecepatan akhir…</b><label style='display:block'><input type='radio' name='q1' value='0'> 2 m/s</label><label style='display:block'><input type='radio' name='q1' value='1'> 3 m/s</label><label style='display:block'><input type='radio' name='q1' value='2'> 6 m/s</label><label style='display:block'><input type='radio' name='q1' value='3'> 9 m/s</label></div><div class='q'><b>3. Kemiringan s–t makin curam berarti…</b><label style='display:block'><input type='radio' name='q2' value='0'> kecepatan makin besar</label><label style='display:block'><input type='radio' name='q2' value='1'> posisi makin tinggi</label><label style='display:block'><input type='radio' name='q2' value='2'> percepatan nol</label><label style='display:block'><input type='radio' name='q2' value='3'> benda diam</label></div><div class='q'><b>4. Luas v–t di bawah sumbu waktu menyatakan…</b><label style='display:block'><input type='radio' name='q3' value='0'> jarak negatif</label><label style='display:block'><input type='radio' name='q3' value='1'> perpindahan arah negatif</label><label style='display:block'><input type='radio' name='q3' value='2'> percepatan</label><label style='display:block'><input type='radio' name='q3' value='3'> tidak bermakna</label></div><button type='submit'>Kirim jawaban</button></form><p id='hasil'></p>
<script>const K=[2, 2, 0, 1];document.getElementById('f').onsubmit=e=>{e.preventDefault();let b=0;K.forEach((k,i)=>{const v=document.querySelector('input[name=q'+i+']:checked');if(v&&+v.value===k)b++});
const s=Math.round(b/K.length*100);document.getElementById('hasil').textContent='Skor: '+s+'% ('+b+' dari '+K.length+')';
parent.postMessage({fims:'skor',skor:s},'*')}</script></body></html>
