<!DOCTYPE html><html lang='id'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Latihan Bertingkat (C)</title><style>body{font-family:system-ui,sans-serif;max-width:720px;margin:0 auto;padding:20px;line-height:1.55;color:#18202f;background:#fff}
h1{font-size:1.4rem}.q{border:1px solid #d9dfea;border-radius:8px;padding:12px;margin:10px 0}button{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #2445c9;background:#2445c9;color:#fff;cursor:pointer}
.k{background:#eef1f8;padding:10px 12px;border-radius:8px}</style></head><body><h1>Latihan Bertingkat (C)</h1><p>Bagian C: tipe TKA. Lulus jika benar 3 dari 4.</p><form id='f'><div class='q'><b>1. Grafik s–t lurus melalui (0,0) dan (5,20). Kecepatannya…</b><label style='display:block'><input type='radio' name='q0' value='0'> 2 m/s</label><label style='display:block'><input type='radio' name='q0' value='1'> 4 m/s</label><label style='display:block'><input type='radio' name='q0' value='2'> 5 m/s</label><label style='display:block'><input type='radio' name='q0' value='3'> 20 m/s</label></div><div class='q'><b>2. Luas v–t segitiga alas 4 s tinggi 8 m/s =…</b><label style='display:block'><input type='radio' name='q1' value='0'> 8 m</label><label style='display:block'><input type='radio' name='q1' value='1'> 16 m</label><label style='display:block'><input type='radio' name='q1' value='2'> 32 m</label><label style='display:block'><input type='radio' name='q1' value='3'> 64 m</label></div><div class='q'><b>3. Kemiringan v–t negatif berarti…</b><label style='display:block'><input type='radio' name='q2' value='0'> diam</label><label style='display:block'><input type='radio' name='q2' value='1'> diperlambat</label><label style='display:block'><input type='radio' name='q2' value='2'> GLB</label><label style='display:block'><input type='radio' name='q2' value='3'> mundur pasti</label></div><div class='q'><b>4. Dua grafik s–t berpotongan berarti…</b><label style='display:block'><input type='radio' name='q3' value='0'> bertabrakan selalu</label><label style='display:block'><input type='radio' name='q3' value='1'> posisi sama saat itu</label><label style='display:block'><input type='radio' name='q3' value='2'> kecepatan sama</label><label style='display:block'><input type='radio' name='q3' value='3'> berhenti</label></div><button type='submit'>Kirim jawaban</button></form><p id='hasil'></p>
<script>const K=[1, 1, 1, 1];document.getElementById('f').onsubmit=e=>{e.preventDefault();let b=0;K.forEach((k,i)=>{const v=document.querySelector('input[name=q'+i+']:checked');if(v&&+v.value===k)b++});
const s=Math.round(b/K.length*100);document.getElementById('hasil').textContent='Skor: '+s+'% ('+b+' dari '+K.length+')';
parent.postMessage({fims:'skor',skor:s},'*')}</script></body></html>
